name: windows-client
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build Windows bootstrap artifact
        shell: bash
        run: |
          python3 scripts/build-bundles.py
          test -f dist/bootstrap-client.ps1
      - name: Run Windows client test suite
        shell: powershell
        run: |
          # StrictMode avoided: PS 5.1 lacks $IsWindows
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\run-all.ps1
      - name: FRP binary smoke (download + hash + version)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # cryptography builds a real CA→leaf chain for the product pin path
          # (OpenSSL CLI is not present on windows-latest by default).
          python -m pip install --upgrade pip
          python -m pip install 'cryptography>=42,<47'
          & .\tests\windows\frp-binary-smoke.ps1

  windows-pwsh7:
    name: Windows PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build Windows bootstrap artifact
        shell: bash
        run: |
          python3 scripts/build-bundles.py
          test -f dist/bootstrap-client.ps1
      - name: Run Windows client test suite
        shell: pwsh
        run: |
          # StrictMode avoided: PS 5.1 lacks $IsWindows
          $ErrorActionPreference = 'Stop'
          & .\tests\windows\run-all.ps1

  linux-pwsh-cross:
    name: Linux pwsh cross-language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL -o /tmp/packages-microsoft-prod.deb \
              https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
            sudo dpkg -i /tmp/packages-microsoft-prod.deb
            sudo apt-get update -qq
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion'
      - name: Run Windows suite under Linux pwsh
        run: pwsh -NoProfile -File tests/windows/run-all.ps1
