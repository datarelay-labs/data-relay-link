name: lint
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Version consistency
        run: ./scripts/check-version-consistency.sh
      - name: Release governance
        run: ./scripts/check-release-governance.sh

      # Full deterministic qualification is intentionally not an ordinary PR/main gate.
      # Run it explicitly for a release candidate after fast preflight has passed.
      - name: Full local non-Docker suite
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./tests/run-all.sh

      # Artifact parity belongs to affected release/installer validation or explicit RC qualification.
      - name: Build standalone bundles
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ./scripts/build-bundles.sh
          git diff --exit-code dist/
      - name: SHA256SUMS
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/verify-sha256sums.sh
      - name: SBOM binds to the checked-out commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 ./scripts/generate-sbom.py -o dist/sbom.spdx.json
          ./scripts/verify-sbom.sh

  portability-containers:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:8
          - rockylinux:9
          - almalinux:9
          - amazonlinux:2023
          - amazonlinux:2
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Container package and CLI portability
        run: ./tests/run-distro-matrix.sh --image ${{ matrix.image }}
