name: OpenSpec validation

on:
  pull_request:
    paths:
      - "openspec/**"
      - "automation/decision_capture/**"
      - "automation/tela_sync/**"
      - "knowledge/CANONICAL_SOURCE_OF_TRUTH.md"
      - "tests/test-decision-capture.py"
      - "tests/test-tela-knowledge-sync.py"
      - "AGENTS.md"
      - ".cursor/commands/opsx-*.md"
      - ".cursor/skills/openspec-*/**"
      - ".cursor/rules/decision-capture.mdc"
      - ".github/workflows/openspec.yml"
      - ".github/workflows/decision-capture.yml"
  push:
    branches:
      - main
    paths:
      - "openspec/**"
      - "automation/decision_capture/**"
      - "automation/tela_sync/**"
      - "knowledge/CANONICAL_SOURCE_OF_TRUTH.md"
      - "tests/test-decision-capture.py"
      - "tests/test-tela-knowledge-sync.py"
      - "AGENTS.md"
      - ".cursor/rules/decision-capture.mdc"
      - ".github/workflows/openspec.yml"
      - ".github/workflows/decision-capture.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.1

      - name: Validate OpenSpec root
        run: openspec doctor --json

      - name: Validate all specs and changes
        run: openspec validate --all --strict

      - name: Test decision capture automation
        run: python3 tests/test-decision-capture.py

      - name: Test Tela knowledge projection
        run: python3 tests/test-tela-knowledge-sync.py
